; AI-mode routing: check mode via Laravel, route accordingly

[from-trunk]
exten => _X.,1,NoOp(--- INCOMING ${CALLERID(num)} -> ${EXTEN} ---)
 same => n,Set(MODE=${CURL(https://talkpilot.synergyinterface.com/api/asterisk/mode/${EXTEN}?token=18102017@talkpilot)})
 same => n,NoOp(MODE=${MODE})
 same => n,Set(MODE=${FILTER(a-zA-Z,${MODE})})
 same => n,GotoIf($[${REGEX("ai","${MODE}")}]?from-trunk,${EXTEN},ai)
 same => n,Goto(from-trunk,${EXTEN},manual)
 same => n,Hangup()
; AI mode
 same => n(ai),Stasis(ai-call-asterisk,${EXTEN},${CALLERID(num)})
 same => n,Hangup()
; Manual mode
 same => n(manual),Dial(PJSIP/SipRecorder,30,t)
 same => n,Hangup()

[internal]
; Agent app (SipRecorder) registers here. Outbound (AI or manual) calls are
; triggered via the Node app API: POST :5300/call {phone, exten}
exten => SipRecorder,1,NoOp(agent landing)
 same => n,Hangup()