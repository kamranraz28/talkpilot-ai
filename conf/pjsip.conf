[global]
type=global
user_agent=SIP/AI-CallCenter

; ===== Trunk registration(s) are auto-generated in pjsip_accounts.conf =====

; ===== Provider endpoint blocks are auto-generated in pjsip_accounts.conf =====

; ===== SipRecorder app registers here (manual/agent mode) =====
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5160
; NAT disclosure: advertise the router's public IP so the provider routes
; incoming INVITEs to our registered contact instead of the LAN/private IP.
external_signaling_address=27.147.163.77
external_signaling_port=5160
external_media_address=27.147.163.77

[SipRecorder]
type=endpoint
context=internal
transport=transport-udp
disallow=all
allow=ulaw
auth=SipRecorder-auth
aors=SipRecorder-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[SipRecorder-auth]
type=auth
auth_type=userpass
username=SipRecorder
password=SipRecorderSecret123

[SipRecorder-aor]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; account file auto-generated by ai-call-asterisk (registrations per shop SIP number)
#include pjsip_accounts.conf